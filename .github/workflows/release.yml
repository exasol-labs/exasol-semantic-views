name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # pyexasol 3 reports usage on connect; tests and CI never do.
  EXASOL_TELEMETRY_DISABLE: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint supports this same-commit syntax

  fuzz:
    needs: tests
    if: ${{ needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      exasol:
        image: exasol/docker-db:latest-2026.1
        ports:
          - 8563:8563
        options: >-
          --privileged
          --shm-size=2gb
    env:
      EXASOL_HOST: 127.0.0.1
      EXASOL_PORT: "8563"
      EXASOL_USER: sys
      EXASOL_PASSWORD: exasol
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install host-test dependencies
        run: python -m pip install -r tools/requirements-osi.txt
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Wait for Exasol
        run: |
          python - <<'PY'
          import os, ssl, time, sys
          import pyexasol
          deadline = time.monotonic() + 300
          last = None
          while time.monotonic() < deadline:
              try:
                  con = pyexasol.connect(
                      dsn=f"{os.environ['EXASOL_HOST']}:{os.environ['EXASOL_PORT']}",
                      user=os.environ["EXASOL_USER"],
                      password=os.environ["EXASOL_PASSWORD"],
                      encryption=True,
                      websocket_sslopt={"cert_reqs": ssl.CERT_NONE},
                  )
                  con.execute("SELECT 1").fetchall()
                  con.close()
                  print("Exasol ready.")
                  sys.exit(0)
              except Exception as e:
                  last = repr(e)[:120]
                  time.sleep(3)
          print(f"Exasol did not become ready in time. Last error: {last}", file=sys.stderr)
          sys.exit(1)
          PY
      - name: Install sales fixture
        run: python tools/install.py --example --reset
      - name: Run release fuzz campaign
        shell: bash
        run: |
          set -o pipefail
          PYTHON_BIN=python sh tools/run_release_gate.sh --fuzz-only 2>&1 | tee fuzz-results.log
      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-results
          path: fuzz-results.log
          if-no-files-found: ignore

  release:
    needs: [tests, fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag still points to the tested commit
        shell: bash
        run: |
          set -euo pipefail
          refs="$(git ls-remote --tags origin "refs/tags/${GITHUB_REF_NAME}" "refs/tags/${GITHUB_REF_NAME}^{}")"
          resolved="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ {peeled=$1} $2 !~ /\^\{\}$/ {direct=$1} END {if (peeled != "") print peeled; else print direct}')"
          test -n "$resolved"
          test "$resolved" = "$GITHUB_SHA"
      - name: Build release bundle
        shell: bash
        run: |
          mkdir -p dist
          bundle="exasol-semantic-views-${GITHUB_REF_NAME}.zip"
          prefix="exasol-semantic-views-${GITHUB_REF_NAME}"
          python tools/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
          # The install SQL is built, not checked in; ship it built so the
          # bundle installs without Python (sql/install/README.md).
          python tools/package_lua_scripts.py
          built=()
          for file in build/install/*.sql; do built+=("--add-file=${file}"); done
          # --add-file takes the --prefix given before it, the tree the last one.
          git archive \
            --format=zip \
            --prefix="${prefix}/build/install/" "${built[@]}" \
            --prefix="${prefix}/" \
            --output="dist/${bundle}" \
            HEAD
          cd dist
          sha256sum "${bundle}" > "${bundle}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="exasol-semantic-views-${GITHUB_REF_NAME}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Exasol Semantic Views ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/${bundle}" \
              "dist/${bundle}.sha256" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/${bundle}" \
              "dist/${bundle}.sha256" \
              --verify-tag \
              --title "Exasol Semantic Views ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
