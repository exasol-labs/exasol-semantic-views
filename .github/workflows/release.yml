name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/runtime-tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release bundle
        shell: bash
        run: |
          mkdir -p dist
          bundle="exasol-semantic-views-${GITHUB_REF_NAME}.zip"
          git archive \
            --format=zip \
            --prefix="exasol-semantic-views-${GITHUB_REF_NAME}/" \
            --output="dist/${bundle}" \
            HEAD
          cd dist
          sha256sum "${bundle}" > "${bundle}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="exasol-semantic-views-${GITHUB_REF_NAME}.zip"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${bundle}" \
            "dist/${bundle}.sha256" \
            --verify-tag \
            --title "Exasol Semantic Views ${GITHUB_REF_NAME}" \
            --generate-notes
