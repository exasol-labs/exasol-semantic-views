name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/runtime-tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release bundle
        shell: bash
        run: |
          mkdir -p dist
          bundle="exasol-semantic-views-${GITHUB_REF_NAME}.zip"
          python tools/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
          git archive \
            --format=zip \
            --prefix="exasol-semantic-views-${GITHUB_REF_NAME}/" \
            --output="dist/${bundle}" \
            HEAD
          cd dist
          sha256sum "${bundle}" > "${bundle}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="exasol-semantic-views-${GITHUB_REF_NAME}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Exasol Semantic Views ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/${bundle}" \
              "dist/${bundle}.sha256" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/${bundle}" \
              "dist/${bundle}.sha256" \
              --verify-tag \
              --title "Exasol Semantic Views ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
