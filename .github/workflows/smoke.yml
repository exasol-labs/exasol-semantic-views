name: Smoke

# Runs the full live-DB smoke suite from tools/run_smoke.sh against a
# throwaway Exasol container. Includes all verify_* scripts, materialization
# gates, OSI round-trips, and Databricks compat.
#
# NOT the release gate: the fuzz campaign is left to tools/run_release_gate.sh
# (invoked separately before major releases) so this workflow stays under ~15
# minutes and can be run on PRs without slowing merges.
#
# Fast-follow layer above runtime-tests.yml: catches regressions that only
# surface at compile/execute time against a real database — e.g. the
# case-sensitivity bug that broke every metric query on 2026-08-13 but sat
# undetected because the smoke suite was manual.
#
# Developers should run tools/run_smoke.sh against an Exasol Personal
# deployment locally (see docs/runtime-testing.md); CI uses the
# exasol/docker-db image below because it is easier to script in Actions.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  pull_request:
    paths:
      - "lua/**"
      - "sql/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    # Bump to a hosted runner with enough RAM: docker-db needs ~4 GiB steady state.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      exasol:
        image: exasol/docker-db:latest-2026.1
        ports:
          - 8563:8563
        # docker-db initialization takes 60–120s; the wait step below polls
        # until it is accepting connections.
        options: >-
          --privileged
          --shm-size=2gb

    env:
      EXASOL_HOST: 127.0.0.1
      EXASOL_PORT: "8563"
      EXASOL_USER: sys
      EXASOL_PASSWORD: exasol

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-osi.txt

      - name: Install host-test dependencies
        run: |
          python -m pip install -r tools/requirements-osi.txt
          python -m pip install pyexasol

      - name: Install Lua (for regenerated-scripts diff step)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Wait for Exasol
        run: |
          python - <<'PY'
          import os, ssl, time, sys
          import pyexasol
          deadline = time.monotonic() + 300  # 5 min max
          last = None
          while time.monotonic() < deadline:
              try:
                  con = pyexasol.connect(
                      dsn=f"{os.environ['EXASOL_HOST']}:{os.environ['EXASOL_PORT']}",
                      user=os.environ["EXASOL_USER"],
                      password=os.environ["EXASOL_PASSWORD"],
                      encryption=True,
                      websocket_sslopt={"cert_reqs": ssl.CERT_NONE},
                  )
                  con.execute("SELECT 1").fetchall()
                  con.close()
                  print("Exasol ready.")
                  sys.exit(0)
              except Exception as e:
                  last = repr(e)[:120]
                  time.sleep(3)
          print(f"Exasol did not become ready in time. Last error: {last}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Run full smoke suite
        run: sh tools/run_smoke.sh
