name: Static checks

on:
  workflow_call:

permissions:
  contents: read

env:
  # pyexasol 3 reports usage on connect; tests and CI never do.
  EXASOL_TELEMETRY_DISABLE: "true"

jobs:
  static-checks:
    # Ruff, mypy, Luacheck (lua/, tests/lua/ and the Lua embedded in
    # sql/install/) and ShellCheck; see tools/run_static_checks.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-static.txt
      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
          sudo luarocks install luacheck 1.2.0
      - name: Install Python checkers
        run: python -m pip install -r tools/requirements-static.txt
      - name: Run static checks
        # ShellCheck is preinstalled on GitHub's Ubuntu runners.
        run: PYTHON_BIN=python sh tools/run_static_checks.sh
      - name: Install zizmor
        run: python -m pip install zizmor==1.31.1
      - name: Audit GitHub Actions workflows
        run: zizmor --format=github .
      - name: Check Markdown links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          config-file: .github/markdown-link-check.json
