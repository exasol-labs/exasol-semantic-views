name: Static checks

on:
  workflow_call:

permissions:
  contents: read

env:
  # pyexasol 3 reports usage on connect; tests and CI never do.
  EXASOL_TELEMETRY_DISABLE: "true"

jobs:
  static-checks:
    # Ruff, mypy, Luacheck, ShellCheck, LuaLS and zizmor; see
    # tools/run_static_checks.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Check links before LuaLS downloads its changelog into build/;
      # the link checker scans every Markdown file in the workspace.
      - name: Check Markdown links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          config-file: .github/markdown-link-check.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-static.txt
      - name: Install Luacheck and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks jq
          sudo luarocks install luacheck 1.2.0
      - name: Install Python checkers
        run: python -m pip install -r tools/requirements-static.txt
      - name: Run static checks
        id: static_checks
        # ShellCheck is preinstalled on GitHub's Ubuntu runners.
        run: PYTHON_BIN=python sh tools/run_static_checks.sh
      - name: Upload LuaLS diagnostics
        if: ${{ always() && steps.static_checks.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: luals-diagnostics
          path: build/luals-check.json
          if-no-files-found: error
