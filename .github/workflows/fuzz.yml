name: Fuzz campaign

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXASOL_TELEMETRY_DISABLE: "true"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      exasol:
        image: exasol/docker-db:latest-2026.1
        ports:
          - 8563:8563
        options: >-
          --privileged
          --shm-size=2gb
    env:
      EXASOL_HOST: 127.0.0.1
      EXASOL_PORT: "8563"
      EXASOL_USER: sys
      EXASOL_PASSWORD: exasol
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install host-test dependencies
        run: python -m pip install -r tools/requirements-osi.txt
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Wait for Exasol
        run: python tools/dev/wait_for_exasol.py
      - name: Install sales fixture
        run: python tools/install.py --example --reset
      - name: Run release fuzz campaign
        shell: bash
        run: |
          set -o pipefail
          PYTHON_BIN=python sh tools/run_release_gate.sh --fuzz-only 2>&1 | tee fuzz-results.log
      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-results
          path: fuzz-results.log
          if-no-files-found: ignore
