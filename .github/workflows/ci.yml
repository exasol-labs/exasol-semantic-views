name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    uses: $/.github/workflows/static-checks.yml

  database-free:
    uses: $/.github/workflows/database-free.yml

  dependency-audit:
    uses: $/.github/workflows/dependency-audit.yml

  system-tests:
    uses: $/.github/workflows/system-tests.yml

  fuzz-smoke:
    uses: $/.github/workflows/fuzz.yml
    with:
      seeds: "0 1 2 7 42"
      cases: "100"
      timeout_minutes: 30
      artifact_name: fuzz-smoke-results

  sonar:
    needs: [database-free, system-tests]
    uses: $/.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-gate:
    if: ${{ always() }}
    needs: [static-checks, database-free, dependency-audit, system-tests, fuzz-smoke, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            if [ "$result" != success ]; then
              echo "CI job result: $result"
              exit 1
            fi
          done
