name: Set up Lua
description: >-
  Provision the project-pinned Lua runtime with the same installer used locally.
inputs:
  version:
    description: Pinned Lua release to provision.
    required: false
    default: "5.4.9"
runs:
  using: composite
  steps:
    - name: Provision project-local Lua
      shell: bash
      env:
        LUA_VERSION: ${{ inputs.version }}
      run: | # zizmor: ignore[github-env] -- newlines are rejected below
        set -euo pipefail
        # GITHUB_ENV treats newlines as separate entries, so reject them before export.
        case "$LUA_VERSION" in
          *$'\n'*|*$'\r'*) echo 'Invalid Lua version' >&2; exit 1 ;;
        esac
        # The installer validates the version against its supported releases.
        python3 tools/lua_runtime.py --version "$LUA_VERSION"
        echo "LUA_VERSION=${LUA_VERSION}" >> "$GITHUB_ENV"
