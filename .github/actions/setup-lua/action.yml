name: Set up Lua
description: >-
  Provision the project-pinned Lua runtime with the same installer used locally.
runs:
  using: composite
  steps:
    - name: Provision project-local Lua
      shell: bash
      run: |
        set -euo pipefail
        bin_dir="$(python3 tools/lua_runtime.py --bin-dir)"
        echo "${bin_dir}" >> "${GITHUB_PATH}"
        echo "LUA_BIN=${bin_dir}/lua" >> "${GITHUB_ENV}"
        echo "LUAC_BIN=${bin_dir}/luac" >> "${GITHUB_ENV}"
