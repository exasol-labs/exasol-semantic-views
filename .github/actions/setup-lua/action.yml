name: Set up Lua
description: >-
  Provision the project-pinned Lua runtime with the same installer used locally.
inputs:
  version:
    description: Pinned Lua release to provision.
    required: false
    default: "5.4.9"
runs:
  using: composite
  steps:
    - name: Provision project-local Lua
      shell: bash
      env:
        LUA_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python3 tools/lua_runtime.py --version "$LUA_VERSION"
        case "$LUA_VERSION" in
          5.4.9) echo 'LUA_VERSION=5.4.9' >> "$GITHUB_ENV" ;;
          5.5.1) echo 'LUA_VERSION=5.5.1' >> "$GITHUB_ENV" ;;
          *) exit 1 ;;
        esac
